name: Conformance fixtures & parity contract

# Enforces zero drift between this SDK's vendored conformance fixtures and the
# canonical set in the spec repo (multiagentcoordinationprotocol). Runs on every
# PR/push so a hand-edited fixture can never merge. See
# tests/conformance/ and `make sync-fixtures` / `make verify-fixtures`.
#
# Also enforces zero drift between the vendored cross-SDK parity contract
# (tests/parity/contract.json) and its canonical source
# (schemas/parity/contract.json), reusing the same spec-repo checkout. See
# tests/parity/SOURCE.md and `make sync-parity` / `make verify-parity`.
#
# If the spec repo is private, configure a read-scoped PAT as the
# CONFORMANCE_SPEC_TOKEN secret; otherwise the default GITHUB_TOKEN is used.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  # npm ci pulls @multiagentcoordinationprotocol/proto from GitHub Packages.
  packages: read

jobs:
  verify-fixtures:
    runs-on: ubuntu-latest
    steps:
      - name: Check out SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out canonical spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: multiagentcoordinationprotocol/multiagentcoordinationprotocol
          path: _spec
          token: ${{ secrets.CONFORMANCE_SPEC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Verify fixtures match canonical (no drift)
        run: make verify-fixtures SPEC_CONFORMANCE_DIR="$GITHUB_WORKSPACE/_spec/schemas/conformance"

      - name: Verify parity contract (no drift)
        run: make verify-parity SPEC_PARITY_DIR="$GITHUB_WORKSPACE/_spec/schemas/parity"

      - name: Lint canonical fixtures for internal consistency
        run: python3 "$GITHUB_WORKSPACE/_spec/schemas/conformance/lint_fixtures.py"

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: 'https://npm.pkg.github.com'
          scope: '@multiagentcoordinationprotocol'
          cache: npm

      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Skipped (not failed) everywhere else: it needs this job's spec checkout.
      - name: Policy builder domains match canonical rule schemas
        env:
          MACP_POLICY_SCHEMAS_DIR: ${{ github.workspace }}/_spec/schemas/json/policy
        run: npx vitest run tests/unit/policy-schema-parity.test.ts
