name: Publish

on:
  release:
    types: [created]

# One repo, several npm packages (release-please-config.json). The release tag
# says which: `v1.2.3` is macp-sdk-typescript at the root; `<component>-v1.2.3`
# is a framework adapter under integrations/ (W3.5), e.g. `langgraph-v0.1.0`
# publishes integrations/langgraph as @multiagentcoordinationprotocol/langgraph.

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: read
    steps:
      - name: Resolve package from tag
        id: pkg
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*) dir=. ;;
            langgraph-v[0-9]*) dir=integrations/langgraph ;;
            *) echo "::error::no package for release tag '$TAG'"; exit 1 ;;
          esac
          echo "dir=$dir" >> "$GITHUB_OUTPUT"
          echo "release $TAG -> $dir"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: ${{ steps.pkg.outputs.dir }}/package-lock.json
      # setup-node points .npmrc auth at npmjs.org for the publish; the root
      # package's proto dependency still resolves from GitHub Packages, so
      # append its token. (The adapters resolve everything from npmjs.)
      - name: Authenticate to GitHub Packages
        if: steps.pkg.outputs.dir == '.'
        run: echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" >> .npmrc
      - run: npm ci
        working-directory: ${{ steps.pkg.outputs.dir }}
      # `prepublishOnly` (check + lint + format:check + test + build at the
      # root; check + format:check + test + build for an adapter) runs as part
      # of publish — the release gate executes against the exact tree being
      # published.
      - run: npm publish --provenance --access public
        working-directory: ${{ steps.pkg.outputs.dir }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  # ── Notify in-org SDK consumer (event-driven bump) ──────────────────
  # After the public-npm publish, dispatch sdk-released {version, ecosystem}
  # to macp-playground, whose bump-sdk.yml opens the bump PR. Zero-PAT.
  dispatch-playground:
    name: Dispatch sdk-released to macp-playground
    runs-on: ubuntu-latest
    needs: [publish]
    # The playground pins macp-sdk-typescript only; adapter releases don't bump it.
    if: startsWith(github.event.release.tag_name, 'v')
    steps:
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          # The secret still holds the numeric App ID, not the App's Client ID —
          # both are accepted as the JWT issuer, and the action funnels `client-id`
          # and the deprecated `app-id` into the same `createAppAuth({appId})` call.
          client-id: ${{ secrets.MACP_BOT_APP_ID }}
          private-key: ${{ secrets.MACP_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: macp-playground

      - name: Dispatch sdk-released
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          OWNER: ${{ github.repository_owner }}
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          V="${VERSION#v}"
          jq -nc --arg v "$V" '{event_type:"sdk-released",client_payload:{version:$v,ecosystem:"npm"}}' \
            | gh api -X POST "repos/$OWNER/macp-playground/dispatches" --input -
          echo "dispatched sdk-released {version=$V, ecosystem=npm} -> macp-playground"
