name: Notify Website of Doc Changes

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'README.md'

permissions: {}

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      # Zero-PAT: mint a short-lived macp-deps-bot token scoped to website.
      - name: Mint GitHub App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          # The secret still holds the numeric App ID, not the App's Client ID —
          # both are accepted as the JWT issuer, and the action funnels `client-id`
          # and the deprecated `app-id` into the same `createAppAuth({appId})` call.
          client-id: ${{ secrets.MACP_BOT_APP_ID }}
          private-key: ${{ secrets.MACP_BOT_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: website

      - name: Trigger website sync
        uses: peter-evans/repository-dispatch@28959ce8df70de7be546dd1250a005dd32156697 # v4.0.1
        with:
          token: ${{ steps.app.outputs.token }}
          repository: multiagentcoordinationprotocol/website
          event-type: docs-updated
