name: Integration

# Runs tests/integration/ (tests/integration/README.md) against a real
# macp-runtime over the actual gRPC boundary. Previously this suite only ran
# by hand against a scratch runtime -- nothing in CI exercised it, so drift
# between this SDK and the runtime's wire behavior could land on main
# unnoticed. This job closes that gap.
#
# Runtime source: the published `ghcr.io/multiagentcoordinationprotocol/
# macp-runtime` image (built + pushed by the runtime repo's docker.yml). The
# image is public, so no registry login is needed to pull it. Two jobs:
#
# - `integration` (required check) pins the immutable 0.9.0 release tag, the
#   minimum runtime this SDK supports (README "Runtime compatibility"). Same
#   pin as macp-sdk-python's gate, so both SDKs are held to byte-identical
#   runtime behavior. Bump it deliberately, in the PR that absorbs a release.
# - `integration-canary` runs the same suite against `:latest` (the runtime's
#   main branch) to catch drift early. It is `continue-on-error`, so a
#   runtime-side regression shows as a red canary without blocking SDK PRs
#   that didn't touch anything relevant.
#
# The runtime is started in dev mode (MACP_ALLOW_INSECURE=1) with
# MACP_MEMORY_ONLY=1 so the job leaves no state, on a scratch port (50123,
# not the runtime's default 50051) so it can never collide with a real
# deployment. `services:` only waits for the container to start, not for the
# gRPC server inside it to be ready to accept requests, so an explicit
# readiness poll (scripts/wait-for-runtime.ts) gates the test run.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      macp-runtime:
        image: ghcr.io/multiagentcoordinationprotocol/macp-runtime:0.9.0
        ports:
          - 50123:50123
        env:
          MACP_BIND_ADDR: 0.0.0.0:50123
          MACP_ALLOW_INSECURE: '1'
          MACP_MEMORY_ONLY: '1'
    env:
      MACP_RUNTIME_ADDRESS: localhost:50123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@multiagentcoordinationprotocol'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Polls the Initialize RPC rather than sleeping a fixed duration or
      # just checking the TCP port -- the port can accept connections before
      # the gRPC services are registered. Fails the job if the runtime never
      # becomes ready within the script's budget.
      - name: Wait for macp-runtime to be ready
        run: npx tsx scripts/wait-for-runtime.ts
      - run: npm run test:integration

  integration-canary:
    # Non-blocking: see the header. Not a required check.
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    services:
      macp-runtime:
        image: ghcr.io/multiagentcoordinationprotocol/macp-runtime:latest
        ports:
          - 50123:50123
        env:
          MACP_BIND_ADDR: 0.0.0.0:50123
          MACP_ALLOW_INSECURE: '1'
          MACP_MEMORY_ONLY: '1'
    env:
      MACP_RUNTIME_ADDRESS: localhost:50123
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@multiagentcoordinationprotocol'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Polls the Initialize RPC rather than sleeping a fixed duration or
      # just checking the TCP port -- the port can accept connections before
      # the gRPC services are registered. Fails the job if the runtime never
      # becomes ready within the script's budget.
      - name: Wait for macp-runtime to be ready
        run: npx tsx scripts/wait-for-runtime.ts
      - run: npm run test:integration

  integration-receipts:
    # Runtime-issued decision receipts (RFC-MACP-0013 §13), which need a
    # runtime that advertises `decision_receipt` (0.11.0+). The pinned 0.9.0
    # job and the canary skip the receipt tests' signed or unsigned half, so
    # each leg here runs one runtime configuration with MACP_EXPECT_RECEIPTS
    # set: a missing capability or a wrong `signed` flag fails the leg instead
    # of skipping it. The signed leg's key is generated per run and never
    # leaves the runner. The runtime is started with `docker run` rather than
    # `services:` because the key only exists once a step has made it.
    #
    # Pinned to the runtime main commit that merged R1 (016afe6) until
    # 0.11.0 is published; then pin `:0.11.0`.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        receipts: [signed, unsigned]
    env:
      MACP_RUNTIME_ADDRESS: localhost:50123
      MACP_EXPECT_RECEIPTS: ${{ matrix.receipts }}
      RUNTIME_IMAGE: ghcr.io/multiagentcoordinationprotocol/macp-runtime:016afe6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'
          scope: '@multiagentcoordinationprotocol'
          cache: npm
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Start macp-runtime (${{ matrix.receipts }})
        run: |
          args=(-e MACP_BIND_ADDR=0.0.0.0:50123 -e MACP_ALLOW_INSECURE=1 -e MACP_MEMORY_ONLY=1)
          if [ "${{ matrix.receipts }}" = signed ]; then
            openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/receipt-signing.pem"
            args+=(-e MACP_RECEIPT_SIGNING_KEY="$(cat "$RUNNER_TEMP/receipt-signing.pem")"
                   -e MACP_RECEIPT_SIGNING_KID=ci-receipts
                   -e MACP_RUNTIME_ID=sdk-typescript-ci)
          fi
          docker run -d --name macp-runtime -p 50123:50123 "${args[@]}" "$RUNTIME_IMAGE"
      - name: Wait for macp-runtime to be ready
        run: npx tsx scripts/wait-for-runtime.ts
      - run: npm run test:integration -- tests/integration/runtime.test.ts -t receipt_
      - if: failure()
        run: docker logs macp-runtime
